<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6a35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fc4c02;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" />
  
  <!-- DD Text -->
  <text x="256" y="256" font-family="Arial, sans-serif" font-size="180" font-weight="bold" 
        text-anchor="middle" dominant-baseline="central" fill="white" filter="url(#shadow)">
    DD
  </text>
  
  <!-- Running shoe accent -->
  <path d="M 180 370 L 332 370 L 320 400 L 192 400 Z" fill="rgba(255,255,255,0.3)" />
</svg>