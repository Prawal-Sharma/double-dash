<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generate DoubleDash Favicon</title>
</head>
<body>
    <h1>DoubleDash Favicon Generator</h1>
    <canvas id="canvas16" width="16" height="16"></canvas>
    <canvas id="canvas32" width="32" height="32"></canvas>
    <canvas id="canvas192" width="192" height="192"></canvas>
    <canvas id="canvas512" width="512" height="512"></canvas>
    
    <script>
        function drawLogo(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            
            // Clear canvas
            ctx.clearRect(0, 0, size, size);
            
            // Draw circular background with gradient
            const gradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
            gradient.addColorStop(0, '#ff6a35');  // Lighter orange in center
            gradient.addColorStop(1, '#fc4c02');  // Strava orange at edge
            
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/2 - size*0.05, 0, 2 * Math.PI);
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Draw "DD" text
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.4}px -apple-system, system-ui, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Add shadow for text
            ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
            ctx.shadowBlur = size * 0.02;
            ctx.shadowOffsetX = size * 0.01;
            ctx.shadowOffsetY = size * 0.01;
            
            ctx.fillText('DD', size/2, size/2 - size*0.02);
            
            // Add running shoe icon for larger sizes
            if (size >= 192) {
                ctx.shadowColor = 'transparent';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.moveTo(size * 0.35, size * 0.72);
                ctx.lineTo(size * 0.65, size * 0.72);
                ctx.lineTo(size * 0.62, size * 0.78);
                ctx.lineTo(size * 0.38, size * 0.78);
                ctx.closePath();
                ctx.fill();
            }
            
            // Convert to blob and download
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                
                if (size === 16) {
                    a.download = 'favicon-16.png';
                } else if (size === 32) {
                    a.download = 'favicon-32.png';
                } else {
                    a.download = `logo${size}.png`;
                }
                
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
        }
        
        // Generate all sizes
        window.onload = function() {
            drawLogo('canvas16', 16);
            drawLogo('canvas32', 32);
            drawLogo('canvas192', 192);
            drawLogo('canvas512', 512);
            
            document.body.innerHTML += '<p>✅ All favicon files have been downloaded! Move them to the public folder.</p>';
        };
    </script>
    
    <style>
        body {
            font-family: -apple-system, system-ui, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        canvas {
            border: 1px solid #ddd;
            margin: 10px;
            background: white;
        }
    </style>
</body>
</html>
